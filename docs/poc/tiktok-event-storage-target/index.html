<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Event Timing storage target</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f7f9fc;
    color: #15213b;
    font: 20px/1.45 system-ui, sans-serif;
  }
  main { width: min(92vw, 42rem); text-align: center; }
  button {
    width: 100%;
    min-height: 44vh;
    border: 4px solid #315da8;
    border-radius: 24px;
    background: #dfeaff;
    color: #102654;
    font: 700 26px/1.3 system-ui, sans-serif;
  }
  #status { margin-top: 16px; overflow-wrap: anywhere; }
</style>
<main>
  <button id="target" type="button">Tap once to navigate the target origin to the top</button>
  <p id="status">TARGET_CHILD_READY</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const nonce = params.get('nonce') || 'missing';
  const storageKey = `cg_tiktok_event_${nonce}`;
  const cookieName = `cg_tiktok_event_${nonce.replace(/[^a-z0-9]/gi, '')}`;
  const status = document.querySelector('#status');
  let scheduled = false;

  try { localStorage.removeItem(storageKey); } catch (_) {}
  document.cookie = `${cookieName}=; Path=/; Max-Age=0; SameSite=None; Secure`;

  document.querySelector('#target').addEventListener('pointerdown', () => {
    if (scheduled) return;
    scheduled = true;
    const topUrl = new URL('top.html', location.href);
    topUrl.searchParams.set('nonce', nonce);
    status.textContent = 'TARGET_TOP_NAVIGATION_SCHEDULED';
    setTimeout(() => {
      try {
        if (typeof window.__cgEventProof === 'string') {
          topUrl.searchParams.set('proof', window.__cgEventProof);
        }
        top.location.href = topUrl.href;
      } catch (error) {
        status.textContent = `TARGET_TOP_NAVIGATION_${error.name}`;
      }
    }, 3000);
    const eventTimingDeadline = performance.now() + 80;
    while (performance.now() < eventTimingDeadline) {}
  }, {once: true});
})();
</script>
